[project]
name = "genea"
version = "0.1.0"
description = "Genealogy knowledge-base agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.11",
    "pydantic-ai-slim[openai]>=2.54",
    "pypdf[fonts]>=6.0",
    "python-docx>=1.2",
    "rich>=15.0",
    "sqlite-vec>=0.1.9",
    "typer>=0.27",
]

[project.optional-dependencies]
cloud = ["pydantic-ai-slim[anthropic]>=2.54"]
mcp = ["mcp>=2.3"]
transcribe = ["pywhispercpp>=1.5", "av>=14", "numpy>=2"]
dna = ["snps>=2.12", "yhaplo @ git+https://github.com/23andMe/yhaplo@f72f88f2818aebd049c29d2ca8fc2f30c3003b17"]
convert = ["huggingface-hub>=0.30", "safetensors>=0.5", "numpy>=2"]

[project.scripts]
genea = "genea.cli.main:app"

[dependency-groups]
dev = ["mcp>=2.3", "pillow>=12.0", "pytest>=8.4", "pytest-xdist>=3.6", "safetensors>=0.5", "reportlab>=5.0", "av>=14", "numpy>=2", "snps>=2.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/genea"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-m 'not live' -n 10"
markers = [
    "exiftool: needs the ExifTool binary (skipped automatically when it is missing)",
    "live: uses a real model, Ollama or whisper.cpp (run with `uv run pytest -m live`)",
]
